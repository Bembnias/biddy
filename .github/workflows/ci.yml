# CI: lint, typecheck, testy jednostkowe, formatowanie, aktualność klienta API i build (job
# „checks”), testy integracyjne z Testcontainers na prawdziwym Postgresie i Redisie w Dockerze
# (job „integration”), obraz API z testem dymnym (job „api-image”) oraz testy e2e aplikacji web
# w Playwright (job „web”). Uruchamia się dla każdego pull requesta i każdego pusha do main.
#
# Wdrożenia (F-09, docs/deployment.md) nie są tu krokami: Render wdraża API i workera z main po
# zielonych checkach tego workflow (render.yaml: autoDeployTrigger: checksPass), a Vercel buduje
# web dla main (staging) i preview dla każdego pull requesta.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nowy push do tego samego pull requesta anuluje poprzedni przebieg. Na main każdy commit
# przechodzi pełne sprawdzenie: od jego wyniku zależy deploy stagingu na Render.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Zdalny cache Turborepo (Vercel), gdy skonfigurowany: sekret TURBO_TOKEN i zmienna TURBO_TEAM
  # w ustawieniach repozytorium. Bez nich działa sam cache lokalny (actions/cache).
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  checks:
    name: Lint, typecheck, testy i build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Wersja pnpm z pola packageManager w package.json.
      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node.js (wersja z .nvmrc) z cache magazynu pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Lokalny cache Turborepo: niezmienione pakiety nie budują się i nie testują od nowa.
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Instalacja zależności
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Także `pnpm api:check`: kontrakt OpenAPI i wygenerowany klient (packages/api-client)
      # muszą zgadzać się z kodem API, więc zmiana DTO bez `pnpm api:generate` kończy się błędem.
      - name: Lint, typecheck, testy jednostkowe, formatowanie i aktualność klienta API
        run: pnpm check

  integration:
    name: Testy integracyjne (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node.js (wersja z .nvmrc) z cache magazynu pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Instalacja zależności
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Docker jest dostępny na runnerach GitHub z Ubuntu; Testcontainers łączy się przez
      # /var/run/docker.sock i sam pobiera obrazy (postgres:17-alpine, redis:7.4-alpine,
      # testcontainers/ryuk).
      - name: Docker
        run: docker version

      - name: Testy integracyjne
        run: pnpm test:integration

  api-image:
    name: Obraz API (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres i Redis jak na Render; Redis ma domyślnie maxmemory-policy noeviction, którego
    # wymaga worker.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: biddy
          POSTGRES_PASSWORD: biddy
          POSTGRES_DB: biddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biddy -d biddy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Ten sam Dockerfile i kontekst co w render.yaml; warstwy w cache GitHub Actions.
      - name: Build obrazu API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: biddy-api:ci
          load: true
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max

      # Migracje (preDeployCommand), API (/health, /ready) i worker z gotowego obrazu.
      - name: Test dymny obrazu
        env:
          IMAGE: biddy-api:ci
          DATABASE_URL: postgres://biddy:biddy@127.0.0.1:5432/biddy
          REDIS_QUEUE_URL: redis://127.0.0.1:6379
        run: .github/scripts/smoke-api-image.sh

  web:
    name: Aplikacja web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v6

      - name: Node.js (wersja z .nvmrc) z cache magazynu pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Instalacja zależności
        run: pnpm install --frozen-lockfile

      # Build web z zależnościami (design tokens, klient API); konfiguracja domyślna (lokalna).
      - name: Build
        run: pnpm turbo run build --filter=@biddy/web...

      - name: Przeglądarka dla Playwright (Chromium)
        run: pnpm --filter @biddy/web exec playwright install --with-deps chromium

      # Na zbudowanej aplikacji (next start): szerokości 360–1440 px, axe-core (WCAG 2.1 AA),
      # klawiatura, 404, robots.txt, nagłówki bezpieczeństwa, brak analityki bez zgody, ekrany
      # kont (logowanie z Turnstile, rejestracja, /konto z SSR) na atrapach API i Turnstile.
      - name: Testy e2e (Playwright)
        run: pnpm --filter @biddy/web test:e2e

      - name: Raport Playwright (przy błędzie)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
