packages:
  - apps/*
  - packages/*
  - infra

# Jedno miejsce z wersjami narzędzi współdzielonych przez pakiety (`"zależność": "catalog:"`).
catalog:
  '@aws-sdk/client-s3': 3.1147.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-boundaries: 7.2.0
  '@eslint/js': 10.0.1
  fastify: 5.12.5
  '@fastify/helmet': 13.1.2
  '@fastify/static': 10.1.5
  globals: 17.13.0
  nestjs-pino: 5.3.1
  nestjs-zod: 5.5.0
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-fastify': 12.1.2
  '@nestjs/swagger': 12.0.2
  '@nestjs/testing': 12.1.2
  nodemailer: 10.0.16
  pg: 8.23.1
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  prettier: 3.9.9
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  '@sentry/nestjs': 11.6.0
  '@swc-node/register': 1.12.1
  '@swc/cli': 0.8.1
  '@swc/core': 1.16.13
  testcontainers: 12.2.0
  '@testcontainers/postgresql': 12.2.0
  tsdown: 0.23.0
  tsx: 4.23.15
  turbo: 2.11.7
  '@types/node': 24.19.1
  '@types/pg': 8.23.1
  # typescript-eslint 8.x wspiera TypeScript < 6.1 (TS 7 nie ma jeszcze zgodnego API).
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  unplugin-swc: 2.0.0
  uuid: 14.0.2
  vite: 8.3.4
  vitest: 5.0.3
  zod: 4.6.5

# pnpm 10 domyślnie blokuje skrypty instalacyjne zależności; esbuild (przez tsx) ma tylko
# weryfikację binarki, więc go dopuszczamy, żeby `pnpm install` nie pokazywał ostrzeżenia.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
# Świadomie pomijane: telemetria swagger-ui (@scarf/scarf), opcjonalne natywne dodatki
# Testcontainers do SSH (cpu-features, ssh2) i komunikat wersji protobufjs (przez Sentry).
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - cpu-features
  - protobufjs
  - ssh2

# nestjs-zod 5.5 deklaruje zgodność z NestJS ≤ 11, ale działa z NestJS 12 (sprawdzone:
# walidacja i generowanie OpenAPI). Zdejmij tę regułę, gdy nestjs-zod oficjalnie wesprze 12.
peerDependencyRules:
  allowedVersions:
    nestjs-zod>@nestjs/common: '12'
    nestjs-zod>@nestjs/swagger: '12'
